name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      since:
        description: 'First-parent commit SHA to start after (empty: only until)'
        type: string
        default: ''
      until:
        description: 'Last mainline commit SHA, inclusive (empty: current main)'
        type: string
        default: ''

permissions:
  contents: read

# Keep earlier pushes queued, including their intermediate mainline commits.
concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  tooling:
    name: Benchmark tooling
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check benchmark tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_benchmark*.py'
          python3 -m unittest discover -s infra/azure -p 'test_*.py'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: benchmarks/bencher/Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_SHA=${{ github.sha }}
          tags: simdurl-bencher:smoke
          load: true
          provenance: false
      - name: Smoke-test the benchmark image without credentials
        run: |
          # Exercise the hosted Docker store's export format before Azure allocation.
          docker save --output "$RUNNER_TEMP/benchmark-image.tar" simdurl-bencher:smoke
          PYTHONPATH=scripts python3 - "$RUNNER_TEMP/benchmark-image.tar" <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          from benchmark_azure_guest import archive_image
          image_id = subprocess.check_output([
              "docker", "image", "inspect", "--format", "{{.Id}}", "simdurl-bencher:smoke",
          ], text=True).strip()
          archive_image(Path(sys.argv[1]), image_id)
          PY
          # Check both the ten-case dashboard and the opt-in diagnostic suite.
          for suite in core full; do
            docker run --rm --network none simdurl-bencher:smoke --suite "$suite" \
              --codec-repeats 1 --codec-iterations 10000 --validation-iterations 10000 \
              --formscan-iterations 20000 --helper-iterations 10000 \
              > "$RUNNER_TEMP/benchmark-$suite.json" 2> "$RUNNER_TEMP/benchmark-$suite.log" || {
                cat "$RUNNER_TEMP/benchmark-$suite.log" >&2
                exit 1
              }
            expected=10
            if [ "$suite" = full ]; then expected=1356; fi
            jq -e --argjson expected "$expected" 'length == $expected' \
              "$RUNNER_TEMP/benchmark-$suite.json" > /dev/null
          done

  commits:
    needs: tooling
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.commits.outputs.matrix }}
      count: ${{ steps.commits.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select every new mainline commit
        id: commits
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || inputs.since }}
          AFTER: ${{ inputs.until || github.sha }}
        run: |
          matrix=$(python3 scripts/benchmark_commits.py --before "$BEFORE" --after "$AFTER" --main-head "$GITHUB_SHA")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "$(jq '.commit | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  benchmark:
    needs: commits
    if: needs.commits.outputs.count != '0'
    runs-on: ubuntu-26.04
    environment: Benchmarking
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.commit }}
      BENCHER_IMAGE: registry.bencher.dev/simdurl:${{ matrix.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - name: Check out the library revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.commit }}
          path: source
          persist-credentials: false
      - name: Install Bencher
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
        with:
          version: 0.6.12
      - name: Prepare the benchmark build context
        run: |
          printf 'DOCKER_CONFIG=%s\n' "$RUNNER_TEMP/bencher-docker" >> "$GITHUB_ENV"
          mkdir -p evidence "$RUNNER_TEMP/bencher-docker" "$RUNNER_TEMP/benchmark-context"
          cp -R source/include source/src harness/benchmarks harness/scripts harness/tests "$RUNNER_TEMP/benchmark-context/"
          git -C harness rev-parse HEAD > evidence/harness-sha.txt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the Bencher registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.bencher.dev
          username: simdurl
          password: ${{ secrets.BENCHER_SECRET }}
      - name: Build and push the benchmark image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/benchmark-context
          file: ${{ runner.temp }}/benchmark-context/benchmarks/bencher/Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_SHA=${{ env.SOURCE_SHA }}
          tags: ${{ env.BENCHER_IMAGE }}
          push: true
      - name: Run on Bencher hardware
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_SECRET }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$BENCHER_API_KEY"
          test -n "$IMAGE_DIGEST"
          image="registry.bencher.dev/simdurl@$IMAGE_DIGEST"
          printf '%s\n' "$image" > evidence/image.txt
          status=0
          bencher run --project simdurl --branch main --hash "$SOURCE_SHA" \
            --testbed intel-v1-gcc15-v1 --spec intel-v1 --adapter json \
            --image "$image" --job-timeout 300 --format json --quiet > evidence/report.json 2> >(tee evidence/bencher.log >&2) || status=$?
          if job=$(jq -er '.job // empty' evidence/report.json); then
            bencher job view simdurl "$job" > evidence/job.json || status=1
          fi
          test "$status" -eq 0
          printf 'Bencher recorded commit `%s`. [Benchmark history](https://bencher.dev/perf/simdurl)\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the report and raw measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ matrix.commit }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 90

  azure-image:
    name: Build Azure image (${{ matrix.commit }})
    needs: commits
    if: vars.AZURE_BENCHMARK_ENABLED == 'true' && needs.commits.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.commit }}
      AZURE_IMAGE: simdurl-azure:${{ matrix.commit }}-${{ github.run_id }}
    # Source compilation has neither Azure OIDC permission nor environment secrets.
    steps:
      - name: Check out the benchmark harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: harness
          persist-credentials: false
      - name: Check out the library commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.commit }}
          path: source
          persist-credentials: false
      - name: Prepare the Azure build context
        run: |
          mkdir -p image "$RUNNER_TEMP/azure-benchmark-context"
          cp -R source/include source/src harness/benchmarks harness/scripts harness/tests "$RUNNER_TEMP/azure-benchmark-context/"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build one commit for Azure
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/azure-benchmark-context
          file: ${{ runner.temp }}/azure-benchmark-context/benchmarks/bencher/Dockerfile
          platforms: linux/amd64
          build-args: SOURCE_SHA=${{ env.SOURCE_SHA }}
          tags: ${{ env.AZURE_IMAGE }}
          load: true
          # The archive contract is one executable image, without attestation manifests.
          provenance: false
      - name: Archive and verify the Azure image
        run: |
          docker save --output image/image.tar "$AZURE_IMAGE"
          sha256sum image/image.tar > image/image.tar.sha256
          docker image inspect --format '{{.Id}}' "$AZURE_IMAGE" > image/image-id.txt
          git -C harness rev-parse HEAD > image/harness-sha.txt
          PYTHONPATH=harness/scripts python3 - <<'PY'
          from pathlib import Path
          from benchmark_azure_guest import archive_image
          archive_image(Path("image/image.tar"), Path("image/image-id.txt").read_text().strip())
          PY
      - name: Retain the image for Azure execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-image-${{ github.run_id }}-${{ matrix.commit }}
          path: image/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 7

  azure-benchmark:
    name: Azure VBMI2 (${{ matrix.commit }})
    needs: [commits, azure-image]
    if: ${{ !cancelled() && needs.commits.result == 'success' && needs.azure-image.result != 'skipped' && vars.AZURE_BENCHMARK_ENABLED == 'true' && needs.commits.outputs.count != '0' }}
    runs-on: ubuntu-26.04
    environment: Benchmarking
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.commit }}
      AZURE_IMAGE: simdurl-azure:${{ matrix.commit }}-${{ github.run_id }}
      AZURE_BENCHMARK_CONFIG: ${{ vars.AZURE_BENCHMARK_CONFIG }}
    steps:
      - name: Check out the Azure controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Retrieve the built image
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: azure-image-${{ github.run_id }}-${{ matrix.commit }}
          path: image/
      - name: Verify and load the image without executing it
        run: |
          sha256sum --check image/image.tar.sha256
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, "scripts")
          from benchmark_azure_guest import archive_image
          directory = Path("image")
          identity = archive_image(directory / "image.tar", (directory / "image-id.txt").read_text().strip())
          if identity["reference"] != os.environ["AZURE_IMAGE"]:
              raise SystemExit("Archive tag does not match the requested benchmark image")
          subprocess.run(["docker", "load", "--input", str(directory / "image.tar")], check=True)
          loaded = subprocess.check_output([
              "docker", "image", "inspect", "--format", "{{.Id}}", identity["reference"],
          ], text=True).strip()
          if loaded not in identity["image_ids"]:
              raise SystemExit("Loaded Docker image is not proven by the archive")
          (directory / "archive-image.json").write_text(json.dumps(identity, sort_keys=True) + "\n")
          # The controller records this store's image ID in the run manifest.
          (directory / "controller-image-id.txt").write_text(loaded + "\n")
          PY
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Allocate, verify VBMI2, measure, and delete the VM
        run: |
          run_id="simdurl-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:8}"
          python3 scripts/benchmark_azure.py run --config "$AZURE_BENCHMARK_CONFIG" \
            --image "$AZURE_IMAGE" --commit "$SOURCE_SHA" \
            --harness-sha "$(cat image/harness-sha.txt)" --run-id "$run_id" \
            --output-dir evidence
      - name: Add build provenance to the evidence
        if: always()
        run: |
          mkdir -p evidence/build
          for item in harness-sha.txt image-id.txt image.tar.sha256 archive-image.json controller-image-id.txt; do
            if test -f "image/$item"; then cp "image/$item" evidence/build/; fi
          done
      - name: Retain Azure results and raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-evidence-${{ github.run_id }}-${{ matrix.commit }}
          path: evidence/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  azure-cleanup:
    name: Ensure Azure deletion (${{ matrix.commit }})
    needs: [commits, azure-benchmark]
    if: ${{ always() && needs.commits.result == 'success' && needs.azure-benchmark.result != 'skipped' && needs.commits.outputs.count != '0' }}
    runs-on: ubuntu-26.04
    environment: Benchmarking
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.commit }}
      AZURE_BENCHMARK_CONFIG: ${{ vars.AZURE_BENCHMARK_CONFIG }}
    # The Azure timer remains responsible if GitHub cannot schedule this job.
    steps:
      - name: Check out the Azure controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Delete any resources remaining for this allocation
        run: |
          # Rerunning only this job increments run_attempt. Earlier allocations
          # retain their original IDs; missing run manifests are harmless.
          status=0
          for ((attempt=1; attempt<=GITHUB_RUN_ATTEMPT; attempt++)); do
            run_id="simdurl-${GITHUB_RUN_ID}-${attempt}-${SOURCE_SHA:0:8}"
            python3 scripts/benchmark_azure.py cleanup --config "$AZURE_BENCHMARK_CONFIG" --run-id "$run_id" || status=1
          done
          exit "$status"

  azure-publish:
    name: Publish Azure results (${{ matrix.commit }})
    needs: [commits, azure-benchmark, azure-cleanup]
    if: ${{ !cancelled() && needs.commits.result == 'success' && needs.azure-benchmark.result != 'skipped' && needs.azure-cleanup.result == 'success' && vars.AZURE_BENCHMARK_ENABLED == 'true' && needs.commits.outputs.count != '0' }}
    runs-on: ubuntu-26.04
    environment: Benchmarking
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.commits.outputs.matrix) }}
    env:
      SOURCE_SHA: ${{ matrix.commit }}
    # This job reads saved JSON and has no Azure permission or source execution.
    steps:
      - name: Retrieve saved Azure results
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: azure-evidence-${{ github.run_id }}-${{ matrix.commit }}
          path: evidence/
      - name: Require complete measurements
        run: test -s evidence/results.json
      - name: Install Bencher
        uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
        with:
          version: 0.6.12
      - name: Publish this commit to the Azure testbed
        env:
          BENCHER_API_KEY: ${{ secrets.BENCHER_SECRET }}
        run: |
          test -n "$BENCHER_API_KEY"
          mkdir -p publication
          bencher run --project simdurl --branch main --hash "$SOURCE_SHA" \
            --testbed azure-d2s-v6-gcc15-v1 --adapter json \
            --file evidence/results.json --format json --quiet \
            > publication/report.json 2> >(tee publication/bencher.log >&2)
          printf 'Azure VBMI2 results recorded for commit `%s`. [Benchmark history](https://bencher.dev/perf/simdurl)\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the Azure publication report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: azure-publication-${{ matrix.commit }}-${{ github.run_attempt }}
          path: publication/
          if-no-files-found: ignore
          retention-days: 90
