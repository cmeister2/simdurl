name: CI and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC portable
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            options: -DSIMDURL_TEST_REQUIRE_BACKEND=sse2
          - name: Linux Clang shared
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            options: -DBUILD_SHARED_LIBS=ON
          - name: Linux GCC native and IPO
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            options: -DSIMDURL_NATIVE=ON -DSIMDURL_ENABLE_IPO=ON -DSIMDURL_TEST_REQUIRE_BACKEND=avx2
          - name: Linux Clang scalar
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            options: -DSIMDURL_DISABLE_SIMD=ON
          - name: Linux Clang portable without auto-vectorization
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            flags: -fno-vectorize -fno-slp-vectorize
            options: -DSIMDURL_DISABLE_SIMD=ON -DSIMDURL_TEST_REQUIRE_BACKEND=portable
          - name: Linux GCC signed char
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            flags: -fsigned-char
            options: ''
          - name: Linux GCC unsigned char
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            flags: -funsigned-char
            options: ''
          - name: macOS ARM64
            os: macos-15
            cc: clang
            cxx: clang++
            options: -DBUILD_SHARED_LIBS=ON
          - name: Windows MSVC static
            os: windows-2022
            cc: cl
            cxx: cl
            options: ''
          - name: Windows MSVC Win32
            os: windows-2022
            cc: cl
            cxx: cl
            options: -A Win32
          - name: Windows MSVC shared
            os: windows-2022
            cc: cl
            cxx: cl
            options: -DBUILD_SHARED_LIBS=ON
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
          CFLAGS: ${{ matrix.flags }}
          CXXFLAGS: ${{ matrix.flags }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIMDURL_BUILD_TESTS=ON -DSIMDURL_BUILD_BENCHMARKS=ON ${{ matrix.options }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test and verify relocated CMake install
        run: ctest --test-dir build -C Release --verbose --output-on-failure
      - name: Retain test and backend execution reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.name }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  sanitizers:
    name: ASan and UBSan (${{ matrix.build_type }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, RelWithDebInfo]
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        env:
          CC: clang
          CXX: clang++
          EXTENDED: ${{ github.event_name == 'schedule' && matrix.build_type == 'RelWithDebInfo' && 'ON' || 'OFF' }}
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DSIMDURL_BUILD_TESTS=ON
          -DSIMDURL_TEST_EXTENDED="$EXTENDED"
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
      - run: cmake --build build --parallel
      # Uninstrumented install consumers cannot link the instrumented archive;
      # ordinary platform jobs retain the relocated install tests.
      - run: ctest --test-dir build --verbose --output-on-failure -E install_consumer
      - name: Retain sanitizer and backend execution reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sanitizers-${{ matrix.build_type }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  memory-sanitizer:
    name: MemorySanitizer (instrumented C tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang
      CXX: clang++
      MSAN_OPTIONS: halt_on_error=1:exit_code=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Keep shadow memory mappings compatible on this disposable runner
        # https://github.com/llvm/llvm-project/issues/78354
        # Keep ASLR enabled; do not retry failed tests or suppress MSan reports.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure instrumented C library and tests
        # C-only targets use MSan libc interceptors. C++ tests run in the other
        # sanitizer jobs, without depending on an uninstrumented C++ runtime here.
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIMDURL_BUILD_TESTS=ON
          -DCMAKE_C_FLAGS="-fsanitize=memory -fsanitize-memory-track-origins=2 -fno-sanitize-recover=all -fPIE -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=memory -pie"
      - name: Build C targets
        run: >-
          cmake --build build --parallel --target
          simdurl_test simdurl_test_header_only simdurl_test_scalar
          simdurl_test_scanner simdurl_test_scanner_header_only simdurl_test_scanner_scalar
          simdurl_test_contract simdurl_test_contract_header_only simdurl_test_contract_scalar
          simdurl_test_memory simdurl_test_memory_header_only simdurl_test_memory_scalar
          simdurl_test_backends
      - run: ctest --test-dir build --verbose --output-on-failure -E 'cpp|install_consumer'
      - name: Retain MemorySanitizer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: memory-sanitizer
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  fuzz:
    name: Differential fuzzing (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: native
            options: -DSIMDURL_NATIVE=ON
          - mode: scalar
            options: -DSIMDURL_DISABLE_SIMD=ON
    env:
      CC: clang
      CXX: clang++
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '60' || '10' }}
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build fuzz targets
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSIMDURL_BUILD_TESTS=OFF -DSIMDURL_BUILD_FUZZERS=ON ${{ matrix.options }}
          cmake --build build --parallel
      - name: Replay committed regression corpus
        run: ctest --test-dir build --verbose --output-on-failure -L corpus
      - name: Run bounded fuzz campaigns
        shell: bash
        run: |
          cp -R fuzz/corpus build/corpus
          mkdir -p build/fuzz-artifacts
          for operation in encode decode scanner; do
            build/fuzz/simdurl_fuzz_"$operation" "build/corpus/$operation" \
              -max_total_time="$FUZZ_SECONDS" -max_len=4104 -timeout=10 \
              -rss_limit_mb=2048 -print_final_stats=1 \
              -artifact_prefix="build/fuzz-artifacts/$operation-" \
              2>&1 | tee "build/fuzz-artifacts/$operation.log"
          done
      - name: Retain evolved corpora, failure inputs and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-${{ matrix.mode }}
          path: |
            build/corpus
            build/fuzz-artifacts
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 30

  coverage:
    name: Implementation coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC: clang-18
      CXX: clang++-18
      LLVM_PROFILE_FILE: ${{ github.workspace }}/build/profiles/%m-%p.profraw
      DEBUGINFOD_URLS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install matching compiler and coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18
      - name: Build coverage-instrumented C and C++ tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSIMDURL_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          cmake --build build --parallel
          mkdir -p build/profiles build/coverage
      - name: Collect profiles and backend execution records
        run: ctest --test-dir build --verbose --output-on-failure -E install_consumer
      - name: Report implementation branch and region coverage
        shell: bash
        run: |
          llvm-profdata-18 merge -sparse build/profiles/*.profraw -o build/coverage/tests.profdata
          objects=(build/tests/simdurl_test)
          for executable in build/tests/simdurl_test*; do
            if [[ -f "$executable" && -x "$executable" && "$executable" != build/tests/simdurl_test ]]; then
              objects+=("-object=$executable")
            fi
          done
          sources=(include/simdurl.h include/simdurl/detail/*.h)
          llvm-cov-18 report "${objects[@]}" -instr-profile=build/coverage/tests.profdata \
            "${sources[@]}" | tee build/coverage/summary.txt
          llvm-cov-18 show "${objects[@]}" -instr-profile=build/coverage/tests.profdata \
            -format=html -output-dir=build/coverage/html -show-branches=count \
            "${sources[@]}"
          llvm-cov-18 export "${objects[@]}" -instr-profile=build/coverage/tests.profdata \
            "${sources[@]}" > build/coverage/coverage.json
      - name: Retain coverage and execution reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: implementation-coverage
          path: |
            build/coverage
            build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  source-package:
    name: Verify release source package
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check release tooling
        run: npm run test:release
      - name: Check AppVeyor alert lifecycle
        run: node --test scripts/test-appveyor-alert.mjs
      - name: Build and prepare source archive without publishing
        run: npm run release:prepare -- 0.0.0
      - name: Build and test the unpacked archive
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          tar -xzf simdurl-0.0.0.tar.gz
          cmake -S simdurl-0.0.0 -B package-build -DCMAKE_BUILD_TYPE=Release -DSIMDURL_BUILD_TESTS=ON
          cmake --build package-build --parallel
          ctest --test-dir package-build --output-on-failure

  release:
    name: Semantic release
    needs: [build, sanitizers, memory-sanitizer, fuzz, coverage, source-package]
    if: >-
      always() && !cancelled() &&
      needs.build.result == 'success' && needs.sanitizers.result == 'success' &&
      needs.memory-sanitizer.result == 'success' && needs.fuzz.result == 'success' &&
      needs.coverage.result == 'success' && needs.source-package.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Preview release
        if: github.event_name != 'schedule' && (github.event_name != 'push' || github.ref != 'refs/heads/main')
        run: npm run release:dry-run
      - name: Tag and publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  success:
    name: Success
    # Report failed or skipped jobs instead of skipping this required check.
    if: ${{ always() }}
    needs: [build, sanitizers, memory-sanitizer, fuzz, coverage, source-package, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require all jobs to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          SANITIZERS_RESULT: ${{ needs.sanitizers.result }}
          MEMORY_SANITIZER_RESULT: ${{ needs.memory-sanitizer.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SOURCE_PACKAGE_RESULT: ${{ needs.source-package.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          test "$BUILD_RESULT" = "success"
          test "$SANITIZERS_RESULT" = "success"
          test "$MEMORY_SANITIZER_RESULT" = "success"
          test "$FUZZ_RESULT" = "success"
          test "$COVERAGE_RESULT" = "success"
          test "$SOURCE_PACKAGE_RESULT" = "success"
          test "$RELEASE_RESULT" = "success"
