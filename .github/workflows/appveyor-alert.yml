name: AppVeyor alert

on:
  status:

permissions: {}

jobs:
  update-alert:
    if: >-
      github.repository == 'cmeister2/simdurl' &&
      github.event.context == 'continuous-integration/appveyor/branch' &&
      contains(fromJSON('["success", "failure", "error"]'), github.event.state)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    concurrency:
      group: appveyor-alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Open or resolve alert issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 3
          script: |
            const { default: updateAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/appveyor-alert.mjs`);
            await updateAlert({ github, context, core });